name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk display-system.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest display-system.apk scripts/setup-tv.sh \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download display-system.apk and setup-tv.sh to the same folder, then run setup-tv.sh."
